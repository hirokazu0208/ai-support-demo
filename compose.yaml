# Demo 2 Step 6A / 6B: frontend / backend のコンテナ化と PostgreSQL。
#
#   ブラウザ → frontend（ホストの 3000 番のみ公開）→ backend:8000 → db:5432（PostgreSQL 18）
#   backend と db はホストへ公開しない（Compose 内部ネットワークのみ）
#
# 起動順: db（pg_isready が healthy）→ migrate（alembic upgrade head が成功して終了）
#         → backend（/health/ready が healthy）→ frontend
#
#   cp .env.example .env                                     # 初回のみ。POSTGRES_PASSWORD を設定する
#   docker compose up -d --build
#   docker compose run --rm backend python -m app.db.seed   # 初期データ（手動。空のときだけ投入）
#   docker compose down        # コンテナ削除（volume のデータは残る）
#   docker compose down -v     # volume も削除（データが消える）
#
#   docker compose --profile test run --rm backend-test     # PostgreSQL（使い捨ての db-test）で pytest
#
# 開発時はホストの uvicorn / npm run dev を使う（DB は SQLite。README 参照）。
# 接続情報は .env（Git 管理対象外）から読み込む。docker compose config の出力はパスワードを含むため共有しないこと。

name: ai-support-desk

# backend / migrate が使う接続 URL（パスワードは .env の値を埋め込む）
x-database-url: &database-url "postgresql+psycopg://${POSTGRES_USER:?.env に POSTGRES_USER を設定してください}:${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}@db:5432/${POSTGRES_DB:?.env に POSTGRES_DB を設定してください}"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18 のイメージは PGDATA=/var/lib/postgresql/18/docker、VOLUME /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    # ports は指定しない（ホストへ公開しない）。確認は docker compose exec db psql で行う
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # DB スキーマを最新にして終了する一回限りのジョブ（アプリ起動時には migration しない方針）
  migrate:
    # backend と同じイメージを使う。ビルドは backend サービスだけが行う
    # （両方に build を書くと、キャッシュがない初回に同名イメージのビルドが競合して失敗する）
    image: ai-support-desk-backend:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    image: ai-support-desk-backend:local
    environment:
      DATABASE_URL: *database-url
    # ports は指定しない（ホストへ公開しない）。frontend からは http://backend:8000 で接続する
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # readiness（DB 接続を含む）。slim イメージに curl はないため Python で確認する
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ai-support-desk-frontend:local
    environment:
      # Next.js のサーバー側からのみ使用（ブラウザには公開しない）
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # backend を呼ばない静的なページ（/ は /inquiries へのリダイレクト）で生存確認する
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/', { redirect: 'manual' }).then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # --- テスト用（--profile test のときだけ起動）-----------------------------------------
  # 開発用の db とは別の使い捨て PostgreSQL。データはメモリ（tmpfs）上にのみ置き、ホストへ公開しない。
  # テストは各テストの開始時に public スキーマを作り直すため、開発用の db は絶対に使わない。
  db-test:
    profiles: ["test"]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ai_support_desk_test
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    image: ai-support-desk-backend:test
    environment:
      TEST_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-test:5432/ai_support_desk_test"
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  # PostgreSQL のデータ。docker compose down では削除されない
  pgdata:
